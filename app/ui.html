<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk Media Downloader</title>
<style>
  :root {
    --paper: #eef1f6; --card: #ffffff; --ink: #0e1b2e; --muted: #5b6b82; --line: #d5dce7;
    --cobalt: #2346d9; --cobalt-dark: #1a36ad; --marker: #f6d743; --ok: #148a5b; --bad: #c23b3b;
    --r-lg: 18px; --r-sm: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, select, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 26px 30px; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  header h1 { font: 650 22px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; margin: 0; letter-spacing: -0.01em; }
  header .ver { color: var(--muted); font-size: 13px; }
  .banner { background: var(--ink); color: #fff; border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; }
  .banner button { margin-left: auto; background: var(--marker); color: var(--ink); border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
  .note { color: var(--muted); font-size: 13px; margin: -8px 0 14px; }
  main { display: grid; grid-template-columns: minmax(340px, 5fr) 6fr; gap: 22px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .paste { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; }
  .count { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; min-height: 44px; }
  .count b { font: 700 38px/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums;
    background: linear-gradient(transparent 58%, var(--marker) 58% 92%, transparent 92%); padding: 0 4px; }
  .count span { color: var(--muted); }
  textarea { width: 100%; min-height: 260px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    background: #f8fafc; font: 13.5px/1.6 Consolas, "Cascadia Mono", ui-monospace, monospace; }
  textarea::placeholder { color: #8a98ad; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
  label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  select { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; background: #fff; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); align-self: end; padding-bottom: 8px; }
  .folder { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .folder code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); background: #f3f5f9; border-radius: 6px; padding: 5px 8px; font: 12.5px Consolas, ui-monospace, monospace; }
  .link { background: none; border: 0; color: var(--cobalt); cursor: pointer; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
  .go { width: 100%; border: 0; border-radius: 12px; padding: 14px; background: var(--cobalt); color: #fff; font-weight: 650; font-size: 16px; cursor: pointer; }
  .go:hover { background: var(--cobalt-dark); }
  .go:disabled { background: #9aa7bd; cursor: not-allowed; }
  .err { color: var(--bad); font-size: 13.5px; margin-top: 8px; min-height: 1em; }

  .list h2 { font: 600 15px/1.3 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; margin: 4px 0 12px; display: flex; align-items: center; }
  .list h2 .link { margin-left: auto; font-weight: 400; font-size: 13px; }
  .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-lg); padding: 28px; text-align: center; }
  .batch { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); margin-bottom: 14px; overflow: hidden; }
  .bhead { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bhead strong { font-weight: 600; }
  .bhead .sum { color: var(--muted); font-size: 13px; }
  .bhead .acts { margin-left: auto; display: flex; gap: 6px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: var(--r-sm); padding: 5px 10px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--cobalt); color: var(--cobalt); }
  .item { display: grid; grid-template-columns: 82px 1fr auto; gap: 10px; align-items: center; padding: 9px 16px; border-bottom: 1px solid #edf0f5; font-size: 13.5px; }
  .item:last-child { border-bottom: 0; }
  .src { font-size: 12px; color: var(--muted); }
  .what { overflow: hidden; }
  .what .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .what .u { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12px; }
  .what .e { color: var(--bad); font-size: 12.5px; }
  .bar { height: 6px; background: #e7ebf2; border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--cobalt); transition: width .4s ease; }
  .state { font-size: 12.5px; white-space: nowrap; }
  .state.done { color: var(--ok); }
  .state.failed { color: var(--bad); }
  footer { margin-top: 26px; color: var(--muted); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bulk Media Downloader</h1>
    <span class="ver" id="ver">version __VERSION__</span>
  </header>
  <div id="banner"></div>

  <main>
    <section class="paste" aria-label="Links to download">
      <div class="count" aria-live="polite"><b id="n">0</b><span id="kinds">links. Paste them below, any way you like.</span></div>
      <textarea id="text" spellcheck="false" placeholder="Paste links from Instagram, TikTok and YouTube.
One per line, or a whole message with links in it.

https://www.instagram.com/reel/…
https://www.tiktok.com/@name/video/…
https://www.youtube.com/shorts/…"></textarea>
      <div class="opts">
        <label class="f">Quality
          <select id="quality"></select>
        </label>
        <label class="check"><input type="checkbox" id="zip"> Also put everything in one ZIP file</label>
      </div>
      <div class="folder">Save to <code id="folder" title=""></code><button class="link" id="pick" type="button">Change</button></div>
      <button class="go" id="go" type="button" disabled>Download</button>
      <div class="err" id="err" role="alert"></div>
    </section>

    <section class="list" aria-label="Downloads">
      <h2>Downloads <button class="link" id="clear" type="button" hidden>Clear finished</button></h2>
      <div id="batches"><div class="empty">Your downloads show up here. Each batch gets its own folder.</div></div>
    </section>
  </main>

  <footer>
    <span>Download only what you made or have permission to use. Not affiliated with Instagram, TikTok or YouTube.</span>
    <span id="engine"></span>
    <button class="link" type="button" id="site">bulkmediadownloader.com</button>
  </footer>
</div>

<script>
const TOKEN = '__TOKEN__';
const LINK_RE = /https?:\/\/[^\s<>"'`]+/gi;
const NAMES = {instagram: 'Instagram', tiktok: 'TikTok', youtube: 'YouTube', other: 'Link'};
const $ = id => document.getElementById(id);
let state = null, maxLinks = 100, starting = false;

function api(path, body) {
  const opt = {method: body ? 'POST' : 'GET', headers: {'X-Token': TOKEN}};
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  return fetch(path, opt).then(async r => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong.');
    return j;
  });
}

function platformOf(url) {
  const host = url.toLowerCase().replace(/^https?:\/\//, '').split('/')[0];
  if (host.endsWith('instagram.com') || host === 'instagr.am') return 'instagram';
  if (host.endsWith('tiktok.com')) return 'tiktok';
  if (host.endsWith('youtube.com') || host.endsWith('youtu.be')) return 'youtube';
  return 'other';
}

function links() {
  const seen = new Set(), out = [];
  for (const m of $('text').value.matchAll(LINK_RE)) {
    const u = m[0].replace(/[.,;:!?)\]}>]+$/, '');
    const k = u.split('#')[0];
    if (!seen.has(k)) { seen.add(k); out.push(u); }
  }
  return out;
}

function updateCount() {
  const ls = links();
  const shown = Math.min(ls.length, maxLinks);
  $('n').textContent = shown;
  if (!ls.length) {
    $('kinds').textContent = 'links. Paste them below, any way you like.';
  } else {
    const c = {};
    ls.slice(0, maxLinks).forEach(u => { const p = platformOf(u); c[p] = (c[p] || 0) + 1; });
    const parts = Object.entries(c).map(([p, n]) => `${n} ${NAMES[p]}`);
    $('kinds').textContent = (shown === 1 ? 'link: ' : 'links: ') + parts.join(', ') +
      (ls.length > maxLinks ? `. Only the first ${maxLinks} are taken.` : '');
  }
  $('go').disabled = !ls.length || starting;
  $('go').textContent = ls.length ? `Download ${shown} ${shown === 1 ? 'link' : 'links'}` : 'Download';
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function openPath(p) { api('/api/open', {path: p}).catch(e => alert(e.message)); }

function timeOf(t) {
  return new Date(t * 1000).toLocaleString([], {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
}

function renderBatches() {
  const box = $('batches');
  const bs = state.batches;
  $('clear').hidden = !bs.some(b => b.done);
  if (!bs.length) {
    box.replaceChildren(el('div', 'empty', 'Your downloads show up here. Each batch gets its own folder.'));
    return;
  }
  box.replaceChildren(...bs.map(b => {
    const card = el('article', 'batch');
    const head = el('div', 'bhead');
    const ok = b.items.filter(i => i.state === 'done').length, bad = b.items.filter(i => i.state === 'failed').length;
    head.append(el('strong', '', timeOf(b.created)));
    head.append(el('span', 'sum', b.done
      ? `${ok} of ${b.items.length} downloaded` + (bad ? `, ${bad} failed` : '')
      : `${ok} of ${b.items.length} done, working…`));
    const acts = el('span', 'acts');
    const f = el('button', 'btn', 'Open folder'); f.type = 'button'; f.onclick = () => openPath(b.folder); acts.append(f);
    if (b.zip_path) { const z = el('button', 'btn', 'Show ZIP'); z.type = 'button'; z.onclick = () => openPath(b.zip_path); acts.append(z); }
    head.append(acts);
    card.append(head);
    if (b.zip_error) card.append(el('div', 'item', b.zip_error));
    b.items.forEach(i => {
      const row = el('div', 'item');
      row.append(el('span', 'src', NAMES[i.platform] || 'Link'));
      const what = el('div', 'what');
      what.append(el('div', 't', i.title || i.url));
      if (i.title) what.append(el('div', 'u', i.url));
      if (i.state === 'working') { const bar = el('div', 'bar'); const fill = el('i'); fill.style.width = Math.max(3, i.percent) + '%'; bar.append(fill); what.append(bar); }
      if (i.state === 'failed' && i.error) what.append(el('div', 'e', i.error));
      row.append(what);
      const st = el('span', 'state ' + i.state);
      if (i.state === 'done') st.textContent = i.files.length === 1 ? '1 file' : `${i.files.length} files`;
      else if (i.state === 'working') st.textContent = i.percent ? i.percent + '%' : 'starting';
      else if (i.state === 'waiting') st.textContent = 'waiting';
      else {
        const r = el('button', 'btn', 'Retry'); r.type = 'button';
        r.onclick = () => api('/api/retry', {batch: b.id, n: i.n}).then(refresh).catch(e => alert(e.message));
        st.append(r);
      }
      row.append(st);
      card.append(row);
    });
    return card;
  }));
}

function renderBanner() {
  const u = state.update || {};
  const box = $('banner');
  box.replaceChildren();
  if (u.app_latest) {
    const b = el('div', 'banner');
    b.append(el('span', '', `Version ${u.app_latest} is out.`));
    const btn = el('button', '', 'Get it'); btn.type = 'button';
    btn.onclick = () => api('/api/website', {page: '/#download'});
    b.append(btn);
    box.append(b);
  }
  if (u.engine_installed && u.engine_installed.length) box.append(el('p', 'note', 'A newer download engine was installed. It is used the next time you open the app.'));
}

let firstState = true;
async function refresh() {
  try {
    state = await api('/api/state');
  } catch (e) { return; }
  maxLinks = state.max_links || 100;
  if (firstState) {
    firstState = false;
    $('quality').replaceChildren(...Object.entries(state.qualities).map(([k, v]) => { const o = el('option', '', v); o.value = k; return o; }));
    $('quality').value = state.settings.quality;
    $('zip').checked = state.settings.zip;
  }
  $('folder').textContent = state.settings.folder;
  $('folder').title = state.settings.folder;
  $('engine').textContent = 'Engine: yt-dlp ' + state.engine;
  renderBanner();
  renderBatches();
  updateCount();
}

function busy() { return state && state.batches.some(b => !b.done); }

let timer = null;
async function loop() {
  clearTimeout(timer);
  await refresh();
  clearTimeout(timer);
  timer = setTimeout(loop, busy() ? 1000 : 15000);
}

$('text').addEventListener('input', updateCount);
$('go').onclick = async () => {
  $('err').textContent = '';
  starting = true; updateCount();
  try {
    await api('/api/start', {text: $('text').value, quality: $('quality').value, zip: $('zip').checked, folder: state.settings.folder});
    $('text').value = '';
    loop();
  } catch (e) {
    $('err').textContent = e.message;
  } finally {
    starting = false; updateCount();
  }
};
$('pick').onclick = () => api('/api/folder', {}).then(j => { state.settings.folder = j.folder; $('folder').textContent = j.folder; $('folder').title = j.folder; });
$('clear').onclick = () => api('/api/clear', {}).then(refresh);
$('site').onclick = () => api('/api/website', {page: '/'});
loop();
</script>
</body>
</html>
